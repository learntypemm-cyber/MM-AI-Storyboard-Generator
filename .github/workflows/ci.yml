name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: npm install
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Type-check and build
        run: npm run build
      - name: Check bundled Flow scripts
        run: |
          python -m py_compile integrations/google-flow-scripting-skill/scripts/validate.py integrations/google-flow-scripting-skill/scripts/generate_storyboard_prompt.py
          python integrations/google-flow-scripting-skill/scripts/validate.py --help
          python integrations/google-flow-scripting-skill/scripts/generate_storyboard_prompt.py integrations/google-flow-scripting-skill/examples/storyboard-spec.json --output /tmp/mm-storyboard-package.md
          grep -q '^GENERATE THE STORYBOARD IMAGE NOW\.$' /tmp/mm-storyboard-package.md
